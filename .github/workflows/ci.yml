name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROVIDER_MSRV: "1.89.0"
  PROVIDER_RUST_TOOLCHAIN: "1.97.0"
  WASM_TOOLS_VERSION: "1.236.1"

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust and wasm-tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$PROVIDER_MSRV" --profile minimal
          rustup toolchain install "$PROVIDER_RUST_TOOLCHAIN" --profile minimal \
            --component clippy --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain "$PROVIDER_RUST_TOOLCHAIN"
          rustup override set "$PROVIDER_RUST_TOOLCHAIN"
          rustup run "$PROVIDER_RUST_TOOLCHAIN" cargo install wasm-tools \
            --version "$WASM_TOOLS_VERSION" --locked
      - name: Run shared shipping gates
        run: ./scripts/validate.sh

  component:
    name: Reproducible component
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source A
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source-a
          persist-credentials: false
      - name: Check out source B
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source-b
          persist-credentials: false
      - name: Install pinned Rust and wasm-tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$PROVIDER_RUST_TOOLCHAIN" --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain "$PROVIDER_RUST_TOOLCHAIN"
          rustup run "$PROVIDER_RUST_TOOLCHAIN" cargo install wasm-tools \
            --version "$WASM_TOOLS_VERSION" --locked
      - name: Build from independent checkouts and compare
        shell: bash
        run: |
          set -euo pipefail
          (cd source-a && ./build.sh)
          (cd source-b && ./build.sh)
          cmp source-a/mediawiki-provider.wasm source-b/mediawiki-provider.wasm
          cmp source-a/mediawiki-provider.wasm.sha256 source-b/mediawiki-provider.wasm.sha256
          wasm-tools validate source-a/mediawiki-provider.wasm
      - name: Upload deterministic component
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mediawiki-provider.wasm
          path: |
            source-a/mediawiki-provider.wasm
            source-a/mediawiki-provider.wasm.sha256
          if-no-files-found: error
          retention-days: 14
