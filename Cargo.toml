[workspace]

[package]
name = "dekopon-mediawiki-provider"
version = "0.8.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "Bounded read-only Wikipedia capabilities for Dekopon, as a WebAssembly component"
repository = "https://github.com/dekopon-agents/dekopon-provider-mediawiki"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "=0.22.1"
clap = { version = "=4.6.6", features = ["derive"] }
dekopon-provider-sdk = "=0.38.0"
ego-tree = "=0.11.0"
form_urlencoded = "=1.2.2"
scraper = { version = "=0.27.0", default-features = false }
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[dev-dependencies]
dekopon-provider-sdk-testkit = "=0.38.0"
dekopon-broker = "=0.38.0"
dekopon-broker-host = "=0.38.0"
dekopon-broker-protocol = "=0.38.0"
dekopon-capability = "=0.38.0"
dekopon-core = "=0.38.0"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
