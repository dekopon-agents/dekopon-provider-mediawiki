[workspace]

[package]
name = "dekopon-mediawiki-provider"
version = "0.3.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "Bounded read-only Wikipedia capabilities for Dekopon, as a WebAssembly component"
repository = "https://github.com/dekopon-agents/dekopon-provider-mediawiki"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "=0.22.1"
dekopon-provider-http = "=0.13.0"
dekopon-provider-sdk = { version = "=0.13.0", features = ["clap"] }
ego-tree = "=0.11.0"
form_urlencoded = "=1.2.2"
scraper = { version = "=0.27.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
wit-bindgen = { version = "=0.62.0", default-features = false, features = ["macros", "realloc"] }

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
